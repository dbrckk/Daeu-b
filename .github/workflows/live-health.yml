name: Disponibilité du site DAEU B permanent
on:
  pull_request:
    paths:
      - '.github/workflows/live-health.yml'
      - 'scripts/healthcheck.py'
      - 'scripts/test_healthcheck.py'
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'
  push:
    paths:
      - '.github/workflows/live-health.yml'
      - 'scripts/healthcheck.py'
      - 'scripts/test_healthcheck.py'
      - 'app/index.html'
      - 'app/app.mjs'
      - 'app/sw.js'
permissions:
  contents: read
concurrency:
  group: daeu-b-live-health
  cancel-in-progress: true
jobs:
  public-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Attendre la fin du déploiement Render après un push
        if: github.event_name == 'push'
        run: sleep 35
      - name: Tester le contrôle de publication sans réseau
        run: python3 -m unittest discover -s scripts -p 'test_healthcheck.py'
      - name: Vérifier le domaine, les ressources PWA et la sécurité
        if: github.event_name != 'pull_request'
        run: python3 scripts/healthcheck.py
