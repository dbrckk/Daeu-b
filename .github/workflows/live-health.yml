name: Disponibilité du site DAEU B permanent
on:
  pull_request:
    paths:
      - '.github/workflows/live-health.yml'
      - 'scripts/healthcheck.py'
      - 'scripts/test_healthcheck.py'
      - 'scripts/browser-live-smoke.mjs'
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-health.yml'
      - 'scripts/healthcheck.py'
      - 'scripts/test_healthcheck.py'
      - 'scripts/browser-live-smoke.mjs'
      - 'app/**'
permissions:
  contents: read
concurrency:
  group: daeu-b-live-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Tester le contrôle de publication sans réseau
        run: python3 -m unittest discover -s scripts -p 'test_healthcheck.py'
      - name: Vérifier le domaine, les ressources PWA et la sécurité
        if: github.event_name != 'pull_request'
        run: python3 scripts/healthcheck.py --wait-seconds 480
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule'
        with:
          node-version: 22
      - uses: actions/cache@v4
        if: github.event_name != 'schedule'
        with:
          path: ~/.cache/ms-playwright
          key: daeu-playwright-${{ runner.os }}-chromium-shell-1.65.0
      - name: Vérifier la reprise d’une copie depuis l’URL publique
        if: github.event_name != 'schedule'
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.65.0
          npx playwright install --only-shell chromium
          node scripts/browser-live-smoke.mjs
