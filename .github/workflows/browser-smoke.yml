name: Validation fonctionnelle Chromium Android
on:
  push:
    paths:
      - 'app/**'
      - '!app/README.md'
      - 'scripts/browser-smoke.mjs'
      - 'scripts/browser-cloud.mjs'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - 'app/**'
      - '!app/README.md'
      - 'scripts/browser-smoke.mjs'
      - 'scripts/browser-cloud.mjs'
      - '.github/workflows/browser-smoke.yml'
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: daeu-playwright-${{ runner.os }}-chromium-shell-1.65.0
      # Les runners hébergés disposent des bibliothèques Chromium usuelles.
      # Éviter apt-get à chaque exécution : cette étape réseau pouvait rester bloquée.
      - name: Installer Chromium headless sans apt
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.65.0
          npx playwright install --only-shell chromium
      - name: Tester le parcours réel et le hors ligne
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory app > /tmp/daeu-http.log 2>&1 &
          node --test app/math-step-checker.test.mjs app/numeric-ink.test.mjs app/equation-ink.test.mjs app/ink-eraser.test.mjs app/ink-transcript.test.mjs app/ink-drafts.test.mjs
          node scripts/browser-smoke.mjs
          node scripts/browser-cloud.mjs
