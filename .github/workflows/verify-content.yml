name: Vérifier le parcours pédagogique
on:
  push:
    paths:
      - '**/*.md'
      - 'scripts/check_content.py'
      - 'scripts/verify_worked_cases.py'
      - 'scripts/audit-coverage.mjs'
      - 'scripts/audit-exams.mjs'
      - 'scripts/audit-coverage.test.mjs'
      - 'scripts/coverage-map.mjs'
      - 'scripts/check_transfers.py'
      - 'scripts/verify_transfer_math.py'
      - 'scripts/verify-transfer-math-ab.mjs'
      - 'audits/**'
      - 'app/**'
      - '.github/workflows/verify-content.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_content.py'
      - 'scripts/verify_worked_cases.py'
      - 'scripts/audit-coverage.mjs'
      - 'scripts/audit-exams.mjs'
      - 'scripts/audit-coverage.test.mjs'
      - 'scripts/coverage-map.mjs'
      - 'scripts/check_transfers.py'
      - 'scripts/verify_transfer_math.py'
      - 'scripts/verify-transfer-math-ab.mjs'
      - 'audits/**'
      - 'app/**'
      - '.github/workflows/verify-content.yml'
permissions:
  contents: read
jobs:
  verify-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier structure et liens de cours
        run: python3 scripts/check_content.py
      - name: Vérifier problèmes, navigation et cache
        run: python3 scripts/verify_app_assets.py
      - name: Vérifier les ateliers et recalculer les exemples
        run: python3 scripts/verify_worked_cases.py
      - name: Vérifier les 20 transferts, grilles et ressources hors connexion
        run: python3 scripts/check_transfers.py
      - name: Vérifier 40 transferts A/B et 20 transferts C par oracles indépendants
        run: |
          node scripts/verify-transfer-math-ab.mjs
          python3 scripts/verify_transfer_math.py
      - name: Vérifier matrice v23 et détecter toute divergence des rapports
        run: node scripts/audit-coverage.mjs --check
      - name: Vérifier les cinq examens et le rapport de couverture
        run: node scripts/audit-exams.mjs --check
      - name: Vérifier syntaxe JS (sans dépendances npm)
        run: |
          node --check scripts/audit-coverage.mjs
          node --check scripts/audit-exams.mjs
          node --check scripts/verify-transfer-math-ab.mjs
          node --check scripts/coverage-map.mjs
          node --check app/start.mjs
          node --check app/auto-backup.mjs
          node --check app/cloud-sync.mjs
          node --check app/app.mjs
          node --check app/engine.mjs
          node --check app/questions.mjs
          node --check app/variants.mjs
          node --check app/exams.mjs
          node --check app/exam-engine.mjs
          node --check app/exam-ui.mjs
          node --check app/exam-generator.mjs
          node --check app/exam-alternative.mjs
          node --check app/exam-applied.mjs
          node --check app/reasoning.mjs
          node --check app/exam-analytics.mjs
          node --check app/exam-blueprint.mjs
          node --check app/exam-recommendation.mjs
          node --check app/exam-remediation.mjs
          node --check app/exam-readiness.mjs
          node --check app/persistence.mjs
          node --check app/jalons.mjs
          node --check app/jalon-progress.mjs
          node --check app/prerequisites.mjs
          node --check app/transfer-progress.mjs
          node --check app/problems-reader.mjs
          node --check app/round.mjs
          node --check app/sw.js
          node --check app/course-catalog.mjs
          node --check app/reading-tools.mjs
          node --check app/reading-bookmark.mjs
          node --check app/course-reader.mjs
          node --check app/course-search.mjs
          node --check app/course-catalog.mjs
      - name: Vérifier notation, jalons, révisions et sauvegardes
        run: node --test app/cloud-sync.test.mjs app/auto-backup.test.mjs app/engine.test.mjs app/exam-engine.test.mjs app/reasoning.test.mjs app/exam-generator.test.mjs app/exam-alternative.test.mjs app/exam-applied.test.mjs app/exam-blueprint.test.mjs app/exam-recommendation.test.mjs app/exam-remediation.test.mjs app/exam-readiness.test.mjs app/persistence.test.mjs app/round.test.mjs app/course-catalog.test.mjs app/reading-bookmark.test.mjs app/course-search.test.mjs scripts/audit-coverage.test.mjs app/jalon-progress.test.mjs app/prerequisites.test.mjs app/transfer-progress.test.mjs
